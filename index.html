
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="MOHAMED EL NAGGAR — Digital Business Card">
  <title>MOHAMED EL NAGGAR | Digital Card</title>

  <style>
    :root {
      color-scheme: light;
      --ink: #171717;
      --muted: #777;
      --line: #ededed;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f7f7f7;
      color: var(--ink);
      font-family: Inter, Arial, sans-serif;
    }

    .card {
      width: min(100%, 390px);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 38px 26px 28px;
      text-align: center;
      box-shadow: 0 18px 55px rgba(0,0,0,.055);
    }

    .mark {
      width: 68px;
      height: 68px;
      margin: 0 auto 22px;
      border: 1px solid #e5e5e5;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 21px;
      font-weight: 650;
      letter-spacing: 1px;
    }

    h1 {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 23px;
      font-weight: 700;
      letter-spacing: 1.1px;
    }

    .subtitle {
      margin: 9px 0 8px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: .4px;
    }

    .role {
      margin: 0 0 28px;
      color: #555;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .15px;
    }

    .links {
      display: grid;
      gap: 11px;
    }

    a.action {
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 13px;
      color: var(--ink);
      text-decoration: none;
      font-size: 14px;
      font-weight: 550;
      transition: .18s ease;
    }

    a.action:hover {
      border-color: #bdbdbd;
      transform: translateY(-1px);
    }

    .icon {
      width: 18px;
      height: 18px;
      display: inline-grid;
      place-items: center;
    }

    /* Payment logos */
    .payments {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .payment-link {
      width: 75px;
      height: 55px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      text-decoration: none;
      transition: .18s ease;
    }

    .payment-link:hover {
      transform: translateY(-2px);
    }

    .payment-link svg {
      width: 70px;
      height: 48px;
      display: block;
    }

    .save {
      width: 100%;
      margin-top: 18px;
      min-height: 52px;
      border: 0;
      border-radius: 13px;
      background: #171717;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="mark" aria-hidden="true">MN</div>

    <h1>MOHAMED EL NAGGAR</h1>

    <p class="subtitle">DIGITAL BUSINESS CARD</p>

    <p class="role">
      Sales &amp; Business Development Consultant
    </p>

    <div class="links">

      <a class="action" href="tel:+201090813285">
        <span class="icon">☎</span>
        Call · 010 9081 3285
      </a>

      <a class="action"
         href="https://wa.me/201090813285"
         target="_blank" rel="noopener">
        <span class="icon">◉</span>
        WhatsApp
      </a>

      <a class="action"
         href="https://www.instagram.com/muhammadahmeddn/"
         target="_blank" rel="noopener">
        <span class="icon">◎</span>
        Instagram
      </a>

    </div>

    <!-- InstaPay & Vodafone Cash -->

    <div class="payments" aria-label="Payment methods">

      <!-- InstaPay -->
      <a class="payment-link"
         href="instapay://pay?ipa=mohamedlnaggar%40instapay"
         aria-label="InstaPay"
         title="InstaPay">

        <svg viewBox="0 0 160 70"
             role="img"
             aria-label="InstaPay">

          <rect x="2" y="2" width="156" height="66"
                rx="14" fill="#fff"/>

          <path d="M22 18h13v34H22z" fill="#6D2C91"/>
          <path d="M40 18h13v34H40z" fill="#F5A623"/>
          <path d="M58 18h13v34H58z" fill="#6D2C91"/>

          <text x="78" y="32"
                font-family="Arial"
                font-size="18"
                font-weight="700"
                fill="#30303A">Insta</text>

          <text x="78" y="50"
                font-family="Arial"
                font-size="18"
                font-weight="700"
                fill="#6D2C91">Pay</text>

        </svg>
      </a>

      <!-- Vodafone Cash -->
      <a class="payment-link"
         href="tel:*9*7%23"
         aria-label="Vodafone Cash"
         title="Vodafone Cash">

        <svg viewBox="0 0 180 70"
             role="img"
             aria-label="Vodafone Cash">

          <rect x="2" y="2" width="176" height="66"
                rx="14" fill="#fff"/>

          <circle cx="34" cy="35" r="22" fill="#E60000"/>

          <path d="M27 20c7-4 17 0 19 8-7-3-13-1-15 5-2 5 1 10 6 13-10 1-19-7-18-17 1-4 4-7 8-9z"
                fill="#fff"/>

          <text x="65" y="31"
                font-family="Arial"
                font-size="15"
                font-weight="700"
                fill="#E60000">vodafone</text>

          <text x="65" y="49"
                font-family="Arial"
                font-size="14"
                font-weight="700"
                fill="#333">cash</text>

        </svg>
      </a>

    </div>

    <button class="save" onclick="saveContact()">
      ＋ Save Contact
    </button>

  </main>

  <script>
    function saveContact() {

      const vcard = [
        "BEGIN:VCARD",
        "VERSION:3.0",
        "FN:MOHAMED EL NAGGAR",
        "TEL;TYPE=CELL:+201090813285",
        "URL:https://www.instagram.com/muhammadahmeddn/",
        "END:VCARD"
      ].join("\r\n");

      const blob = new Blob(
        [vcard],
        { type: "text/vcard;charset=utf-8" }
      );

      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = "Mohamed-El-Naggar.vcf";

      document.body.appendChild(a);
      a.click();
      a.remove();

      URL.revokeObjectURL(url);
    }
  </script>

</body>
</html>
